name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint (py_compile)
        run: python -m py_compile server.py

      - name: Smoke — boot server in background and hit /api/health
        run: |
          set -eux
          export CLICKDOC_LISTEN_PORT=18088
          export CLICKDOC_DB_PATH="$RUNNER_TEMP/test.db"
          python server.py &
          PID=$!
          # Wait for the server to actually start serving (max 10s).
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:18088/api/health" >/dev/null 2>&1 && break
            sleep 0.5
          done
          # Python json.dumps adds a space after ':' by default, so grep
          # patterns tolerate optional whitespace between key and value.
          curl -fsS "http://127.0.0.1:18088/api/health" | grep -E '"status":\s*"ok"'
          curl -fsS "http://127.0.0.1:18088/api/annotations" | grep -E '^\s*\[\s*\]\s*$'
          # POST + GET round-trip
          curl -fsS -X POST "http://127.0.0.1:18088/api/annotations" \
            -H 'Content-Type: application/json' \
            -d '{"page":"/x","type":"comment","comment":"ci ping"}' | grep -E '"id":\s*1\b'
          curl -fsS "http://127.0.0.1:18088/api/feed?status=open" | grep 'ci ping'
          curl -fsS -X PATCH "http://127.0.0.1:18088/api/annotations/1" \
            -H 'Content-Type: application/json' \
            -d '{"status":"addressed","response":"ok"}' | grep -E '"status":\s*"addressed"'
          curl -fsS -X DELETE "http://127.0.0.1:18088/api/annotations/1" | grep -E '"deleted":\s*1\b'
          kill $PID

      - name: Smoke — overlay resolution
        run: |
          set -eux
          export CLICKDOC_LISTEN_PORT=18089
          export CLICKDOC_DB_PATH="$RUNNER_TEMP/test2.db"
          OVERLAY="$RUNNER_TEMP/overlay/pages"
          mkdir -p "$OVERLAY"
          echo '<!doctype html><title>OVERLAY</title><body>overlay wins</body>' > "$OVERLAY/index.html"
          export CLICKDOC_PAGES_DIR="$OVERLAY"
          python server.py &
          PID=$!
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:18089/api/health" >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS "http://127.0.0.1:18089/pages/index.html" | grep 'overlay wins'
          # bundled fallback for a page only in bundled/
          curl -fsS "http://127.0.0.1:18089/pages/api.html" | grep -E 'API reference|api'
          kill $PID
