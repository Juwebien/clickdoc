# Expose a host-running clickdoc (port 8088 on the cluster node) through
# Kubernetes Gateway API. This pattern targets installations where the
# cluster runs ON the same machine as the clickdoc process (a k3s node,
# a k3d cluster on a homelab) so HostNetwork or host-IP routing is OK.
#
# Adjust:
#   - HOSTNAME placeholder              → your DNS that resolves to the node
#   - HOST_IP placeholder               → the node's host IP
#   - parentRefs to your Gateway        → e.g. envoy-gateway, traefik
#   - namespace                          → wherever your Gateway lives
#
# Apply with:  kubectl apply -f httproute.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: clickdoc-host
  namespace: clickdoc
spec:
  type: ExternalName
  externalName: HOST_IP                  # e.g. 192.168.3.139 or the literal node IP
  ports:
    - name: http
      port: 8088
      protocol: TCP
      targetPort: 8088
---
apiVersion: v1
kind: Namespace
metadata:
  name: clickdoc
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clickdoc
  namespace: clickdoc
spec:
  parentRefs:
    # Point at your existing Gateway. Adjust group/kind/namespace.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
      namespace: envoy-gateway-system
  hostnames:
    - HOSTNAME                            # e.g. docs.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - kind: Service
          name: clickdoc-host
          port: 8088
